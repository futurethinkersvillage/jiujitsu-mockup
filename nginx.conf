# clearwatermma.ca is the live club site: its home page is the blue (Tenugui) site.
# Any other host (jiujitsu.designspore.co) keeps the design-directions page.
map $host $home_page { ~*clearwatermma\.ca$ /home.html; default /index.html; }

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  types { text/markdown md; }
  include /etc/nginx/mime.types;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml text/markdown;
  location ~* \.(css|js)$ { expires 1h; add_header Cache-Control "public"; }
  location = /events.ics { types { } default_type "text/calendar; charset=utf-8"; add_header Cache-Control "public, max-age=3600"; add_header Access-Control-Allow-Origin "*"; }
  include /etc/nginx/private/*.conf;
  absolute_redirect off;
  # The Wells Gray direction was replaced by Stone & Water
  location ^~ /wellsgray { return 301 /stone/; }
  # Short link for posters and texts
  location ~ ^/whatsapp/?$ { return 302 https://chat.whatsapp.com/CLJdBec0hAzFXTIkviskQX; }
  location = / { try_files $home_page =404; }
  location = /index.html { try_files $home_page =404; }
  location / { try_files $uri $uri/ =404; }
}
