<header><h1>Shi Mizu Dojo · 20 logo concepts</h1>
<p>Judo-gi blue #0556A8, vermilion #C8402A, cotton #EEE9DD. The small mark at the bottom right of each card is the same logo at 32 px, to show how it holds up as an app icon or favicon. Pick a few favourites and we'll refine them.</p></header>
